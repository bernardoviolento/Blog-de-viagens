<!DOCTYPE html>
<html>

<head>
    <title>Artigo</title>
</head>

<body>

    <h1>Título do Artigo</h1>
    <p>Conteúdo completo do artigo.</p>

    <h3>Comentários</h3>
    <textarea id="coment"></textarea>
    <button onclick="comentar()">Enviar</button>
    <div id="lista"></div>

    <script>
        function comentar() {
            if (localStorage.getItem("logado") !== "true") {
                alert("Faça login para comentar")
                return
            }
            let user = JSON.parse(localStorage.getItem("usuario"))
            lista.innerHTML += `<p><b>${user.nome}:</b> ${coment.value}</p>`
            coment.value = ""
        }
    </script>

</body>

</html>
